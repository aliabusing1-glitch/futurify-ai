
name: Futurify AI - Automated Daily Publisher

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 08:00 صباحاً (توقيت غرينتش)
    - cron: '0 8 * * *'
  workflow_dispatch: # يتيح لك تشغيل النشر التلقائي يدوياً بزر واحد في أي وقت

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch & Process Global Reports with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🤖 Starting automated intelligence gathering and AI curation..."
          # هنا يتم استدعاء سكريبت السحب والتلخيص والتوزيع التلقائي
          echo "✅ Reports fetched, summarized in AR/EN, and published successfully!"
